apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "freedom-sentry.fullname" . }}
  labels:
    {{- include "freedom-sentry.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate  # Only one instance should run
  selector:
    matchLabels:
      {{- include "freedom-sentry.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if .Values.secret.create }}
        checksum/secret: {{ .Values.secret.accessToken | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "freedom-sentry.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "freedom-sentry.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: freedom-sentry
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        args:
        {{- if .Values.config.skipInitFullscan }}
        - "--skip-init-fullscan"
        {{- end }}
        env:
        - name: ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secret.existingSecret | default (include "freedom-sentry.fullname" .) }}
              key: accessToken
        - name: API_ENDPOINT
          value: {{ .Values.config.apiEndpoint | quote }}
        - name: LIST_NAME
          value: {{ .Values.config.listName | quote }}
        {{- with .Values.env }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Always
